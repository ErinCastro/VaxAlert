<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard</title>

<link rel="stylesheet" href="sidebar.css" />
<link rel="stylesheet" href="toast.css" />

<style>
  body {
    display: flex;
    background: #f1f5f9;
    font-family: "Segoe UI", sans-serif;
    margin: 0;
  }

  .main {
    flex: 1;
    padding: 40px;
  }

  .page-header {
    margin-bottom: 22px;
  }

  .page-header h1 {
    font-size: 24px;
    color: #1e293b;
    margin: 0;
  }

  .page-header p {
    font-size: 14px;
    color: #64748b;
    margin: 6px 0 0;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(180px, 1fr));
    gap: 18px;
    margin-bottom: 22px;
  }

  .stat {
    background: white;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 78px;
  }

  .stat-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: grid;
    place-items: center;
  }

  .icon svg {
    width: 20px;
    height: 20px;
  }

  .icon.due {
    background: #fff7ed;
    color: #c2410c;
  }

  .icon.overdue {
    background: #fee2e2;
    color: #b91c1c;
  }

  .icon.completed {
    background: #dcfce7;
    color: #15803d;
  }

  .icon.children {
    background: #dbeafe;
    color: #1d4ed8;
  }

  .stat-label {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 3px;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 700;
    color: #0f172a;
  }

  .card {
    background: white;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
    overflow: hidden;
  }

  .tabs {
    display: flex;
    gap: 22px;
    padding: 14px 18px 0;
    border-bottom: 1px solid #e2e8f0;
  }

  .tab {
    border: none;
    background: transparent;
    padding: 12px 0;
    font-size: 13px;
    color: #64748b;
    cursor: pointer;
    position: relative;
  }

  .tab.active {
    color: #b45309;
    font-weight: 600;
  }

  .tab.active::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 2px;
    background: #f59e0b;
    border-radius: 999px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    gap: 14px;
  }

  .search {
    flex: 1;
    max-width: 380px;
  }

  .search input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #cbd5e1;
    font-size: 13px;
    outline: none;
    background: #f8fafc;
  }

  .filter-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid #e2e8f0;
    background: #ffffff;
    padding: 9px 12px;
    border-radius: 10px;
    cursor: pointer;
    color: #334155;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }

  .filter-btn svg {
    width: 16px;
    height: 16px;
  }

  /* ── Filter dropdown ── */
  .filter-wrap { position: relative; }
  .filter-dropdown {
    display: none; position: absolute; top: calc(100% + 8px); right: 0;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.12); z-index: 200;
    min-width: 200px; padding: 8px;
  }
  .filter-dropdown.open { display: block; }
  .filter-option {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px;
    border-radius: 8px; font-size: 13px; color: #334155; cursor: pointer;
    border: none; background: none; width: 100%; text-align: left;
  }
  .filter-option:hover { background: #f8fafc; }
  .filter-option.active { background: #eff6ff; color: #1d4ed8; font-weight: 600; }
  .filter-option svg { width: 15px; height: 15px; flex-shrink: 0; }
  .filter-btn.has-filter { border-color: #1d4ed8; color: #1d4ed8; background: #eff6ff; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    background: #f8fafc;
    padding: 12px 18px;
    text-align: left;
    color: #64748b;
    font-weight: 600;
  }

  td {
    padding: 14px 18px;
    border-top: 1px solid #e2e8f0;
    color: #334155;
  }

  .name {
    font-weight: 600;
    color: #0f172a;
  }

  .badge {
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 12px;
    display: inline-block;
  }

  .badge.due {
    background: #fef3c7;
    color: #b45309;
  }

  .badge.overdue {
    background: #fee2e2;
    color: #b91c1c;
  }

  .badge.upcoming {
    background: #e0f2fe;
    color: #0369a1;
  }

  .actions {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .icon-btn {
    border: none;
    background: transparent;
    cursor: pointer;
    color: #64748b;
    padding: 4px;
    border-radius: 8px;
  }

  .icon-btn:hover {
    background: #f1f5f9;
    color: #0f172a;
  }

  .icon-btn svg {
    width: 18px;
    height: 18px;
  }

  /* ── Vaccination info modal ── */
  .vacc-overlay {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(10, 25, 50, 0.55); backdrop-filter: blur(4px);
    justify-content: center; align-items: center;
  }
  .vacc-overlay.active { display: flex; }
  .vacc-modal {
    background: #fff; border-radius: 18px; width: 680px;
    max-width: 95vw; max-height: 85vh; display: flex;
    flex-direction: column; box-shadow: 0 24px 64px rgba(0,0,0,0.22);
    overflow: hidden; animation: vaccPop 0.3s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes vaccPop {
    from { opacity: 0; transform: scale(0.94) translateY(14px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .vacc-modal-head {
    padding: 22px 24px 18px; border-bottom: 1px solid #e2e8f0;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .vacc-modal-head h2 { font-size: 17px; font-weight: 700; color: #0f172a; margin: 0; }
  .vacc-modal-head p  { font-size: 13px; color: #64748b; margin: 4px 0 0; }
  .vacc-close {
    border: none; background: #f1f5f9; border-radius: 8px;
    padding: 6px 10px; cursor: pointer; color: #64748b;
    font-size: 18px; line-height: 1; flex-shrink: 0;
  }
  .vacc-close:hover { background: #e2e8f0; color: #0f172a; }
  .vacc-tabs { display: flex; border-bottom: 1px solid #e2e8f0; padding: 0 24px; }
  .vacc-tab {
    padding: 12px 18px; font-size: 13px; font-weight: 600; color: #64748b;
    cursor: pointer; border-bottom: 3px solid transparent;
    background: none; border-top: none; border-left: none; border-right: none;
  }
  .vacc-tab.active { color: #142e5c; border-bottom-color: #142e5c; }
  .vacc-body { overflow-y: auto; padding: 20px 24px; flex: 1; }
  .vacc-section { display: none; }
  .vacc-section.active { display: block; }
  .vacc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .vacc-table th { background: #f8fafc; padding: 10px 14px; text-align: left; color: #64748b; font-weight: 600; border-bottom: 1px solid #e2e8f0; }
  .vacc-table td { padding: 12px 14px; border-top: 1px solid #f1f5f9; color: #334155; vertical-align: top; }
  .vacc-table tr:hover td { background: #f8fafc; }
  .badge.completed { background: #dcfce7; color: #166534; }
  .badge.due-soon  { background: #fef9c3; color: #854d0e; }
  .vacc-empty  { text-align: center; padding: 36px 0; color: #94a3b8; font-size: 13px; }
  .vacc-loading{ text-align: center; padding: 36px 0; color: #94a3b8; font-size: 13px; }

  @media (max-width: 1100px) {
    .stats {
      grid-template-columns: repeat(2, minmax(180px, 1fr));
    }
  }

  @media (max-width: 720px) {
    body {
      flex-direction: column;
    }

    .sidebar {
      width: auto;
      height: auto;
    }

    .main {
      padding: 18px;
    }

    .toolbar {
      flex-direction: column;
      align-items: stretch;
    }

    .search {
      max-width: none;
    }
  }
</style>
</head>

  <script>
const API_BASE_URL = "http://localhost:5502";
let allVaccinations = [];
let stats = { due: 0, overdue: 0, completed: 0, children: 0 };

function getAuthToken() { return localStorage.getItem("idToken"); }

async function apiCall(endpoint, options = {}) {
  const token = getAuthToken();
  if (!token) { window.location.href = "login.html"; return null; }
  const headers = { "Content-Type": "application/json", "Authorization": `Bearer ${token}`, ...options.headers };
  try {
    const response = await fetch(`${API_BASE_URL}${endpoint}`, { ...options, headers });
    if (response.status === 401 || response.status === 403) { localStorage.clear(); window.location.href = "login.html"; return null; }
    if (!response.ok) return null;
    return await response.json();
  } catch (error) { console.error("API call failed:", error); return null; }
}

async function verifyAdminAccess() {
  const profile = await apiCall("/api/admin/profile");
  if (!profile) {
    localStorage.clear();
    window.location.href = "login.html";
    return false;
  }
  return true;
}

function formatDate(timestamp) {
  if (!timestamp) return "N/A";
  const date = new Date(typeof timestamp === "number" ? timestamp : timestamp.seconds * 1000);
  return date.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
}

async function loadAdminProfile() {
  const profile = await apiCall("/api/admin/profile");
  if (profile) {
    const adminName = `${profile.firstName} ${profile.lastName}`;
    document.getElementById("sidebarName").textContent = adminName;
    localStorage.setItem("adminName", adminName);
  }
}

async function loadStats() {
  const s = await apiCall("/api/admin/stats");
  if (!s) return;
  stats = s;
  document.getElementById("statDue").textContent = stats.due;
  document.getElementById("statOverdue").textContent = stats.overdue;
  document.getElementById("statCompleted").textContent = stats.completed;
  document.getElementById("statChildren").textContent = stats.totalChildren;
}

async function loadVaccinations() {
  const allVaccs = await apiCall("/api/admin/vaccinations");
  if (!allVaccs) return;
  allVaccinations = allVaccs;
}

function badge(status) {
  if (status === "due") return '<span class="badge due">Due Soon</span>';
  if (status === "overdue") return '<span class="badge overdue">Overdue</span>';
  return '<span class="badge upcoming">Upcoming</span>';
}

let activeTab = "due";
let activeFilter = "all";

function inDateRange(timestamp, range) {
  if (range === "all") return true;
  const now = new Date(); now.setHours(0,0,0,0);
  const due = new Date(timestamp);
  const end = new Date(now);
  if (range === "week")    end.setDate(end.getDate() + 7);
  if (range === "month")   end.setMonth(end.getMonth() + 1);
  if (range === "3months") end.setMonth(end.getMonth() + 3);
  return due >= now && due <= end;
}

function render() {
  const q = (document.getElementById("searchInput").value || "").toLowerCase();
  const filtered = allVaccinations.filter(r => {
    const matchesTab = r.status === activeTab;
    const matchesQuery = (r.childName + " " + r.vaccineName).toLowerCase().includes(q);
    const matchesDate  = activeTab === "overdue" ? true : inDateRange(r.dueDate, activeFilter);
    return matchesTab && matchesQuery && matchesDate;
  });

  document.getElementById("rows").innerHTML = filtered.map(r => `
    <tr>
      <td class="name">${r.childName}</td>
      <td>${r.vaccineName} (${r.dose})</td>
      <td>${formatDate(r.dueDate)}</td>
      <td>${badge(r.status)}</td>
      <td style="text-align: right">
        <div class="actions" style="justify-content:flex-end;">
          <button class="icon-btn" title="View" type="button"
              onclick="openVaccModal('${r.childId}', '${r.childName.replace(/'/g, "\\'")}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </td>
    </tr>
  `).join("");
}

async function initializePage() {
  if (!await verifyAdminAccess()) return;
  await loadAdminProfile();
  await loadStats();
  await loadVaccinations();
  render();
}

// ── Vaccination Info Modal ──
const vaccOverlay = document.getElementById("vaccOverlay");
const vaccClose   = document.getElementById("vaccClose");

vaccClose.addEventListener("click", () => vaccOverlay.classList.remove("active"));
vaccOverlay.addEventListener("click", e => { if (e.target === vaccOverlay) vaccOverlay.classList.remove("active"); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && vaccOverlay.classList.contains("active")) vaccOverlay.classList.remove("active"); });

vaccOverlay.querySelectorAll(".vacc-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    vaccOverlay.querySelectorAll(".vacc-tab").forEach(t => t.classList.remove("active"));
    vaccOverlay.querySelectorAll(".vacc-section").forEach(s => s.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(tab.dataset.tab === "scheduled" ? "tabScheduled" : "tabAdministered").classList.add("active");
  });
});

async function openVaccModal(childId, childName) {
  document.getElementById("vaccModalTitle").textContent = childName;
  document.getElementById("vaccModalSub").textContent = "Loading\u2026";
  document.getElementById("tabScheduled").innerHTML = '<div class="vacc-loading">Loading&#8230;</div>';
  document.getElementById("tabAdministered").innerHTML = "";

  vaccOverlay.querySelectorAll(".vacc-tab").forEach(t => t.classList.remove("active"));
  vaccOverlay.querySelectorAll(".vacc-section").forEach(s => s.classList.remove("active"));
  vaccOverlay.querySelector(".vacc-tab[data-tab='scheduled']").classList.add("active");
  document.getElementById("tabScheduled").classList.add("active");
  vaccOverlay.classList.add("active");

  const data = await apiCall(`/api/admin/children/${childId}/vaccinations`);
  if (!data) {
    document.getElementById("tabScheduled").innerHTML = '<div class="vacc-empty">Failed to load vaccination data.</div>';
    return;
  }

  const { scheduled, administered } = data;
  document.getElementById("vaccModalSub").textContent =
    `${administered.length} administered \u00b7 ${scheduled.filter(v => v.status === "overdue").length} overdue \u00b7 ${scheduled.filter(v => v.status !== "overdue").length} upcoming`;

  const statusBadge = s =>
    s === "overdue"  ? '<span class="badge overdue">Overdue</span>'  :
    s === "due-soon" ? '<span class="badge due-soon">Due Soon</span>' :
                       '<span class="badge upcoming">Upcoming</span>';

  document.getElementById("tabScheduled").innerHTML = scheduled.length === 0
    ? '<div class="vacc-empty">No upcoming or overdue vaccines.</div>'
    : `<table class="vacc-table"><thead><tr><th>Vaccine</th><th>Dose</th><th>Due Date</th><th>Status</th></tr></thead><tbody>
        ${scheduled.map(v => `<tr><td>${v.vaccineName}</td><td>${v.dose||"\u2014"}</td><td>${formatDate(v.dueDate)}</td><td>${statusBadge(v.status)}</td></tr>`).join("")}
      </tbody></table>`;

  document.getElementById("tabAdministered").innerHTML = administered.length === 0
    ? '<div class="vacc-empty">No vaccines have been administered yet.</div>'
    : `<table class="vacc-table"><thead><tr><th>Vaccine</th><th>Dose</th><th>Date Given</th><th>Given By</th><th>Notes</th></tr></thead><tbody>
        ${administered.map(v => `<tr><td>${v.vaccineName}</td><td>${v.dose||"\u2014"}</td><td>${v.administeredDate ? formatDate(v.administeredDate) : "\u2014"}</td><td>${v.administeredBy||"\u2014"}</td><td>${v.notes||"\u2014"}</td></tr>`).join("")}
      </tbody></table>`;
}

function logout() { localStorage.clear(); window.location.href = "login.html"; }

document.getElementById("searchInput").addEventListener("input", render);

// ── Filter dropdown ──
const filterBtn      = document.getElementById("filterBtn");
const filterDropdown = document.getElementById("filterDropdown");

filterBtn.addEventListener("click", e => {
  e.stopPropagation();
  filterDropdown.classList.toggle("open");
});
document.addEventListener("click", () => filterDropdown.classList.remove("open"));

filterDropdown.querySelectorAll(".filter-option").forEach(opt => {
  opt.addEventListener("click", e => {
    e.stopPropagation();
    activeFilter = opt.dataset.range;
    filterDropdown.querySelectorAll(".filter-option").forEach(o => o.classList.remove("active"));
    opt.classList.add("active");
    const isFiltered = activeFilter !== "all";
    filterBtn.classList.toggle("has-filter", isFiltered);
    const label = isFiltered ? opt.textContent.trim() : "Filter";
    filterBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9v7l4 2v-9l8-9z"></path></svg> ${label}`;
    filterDropdown.classList.remove("open");
    render();
  });
});

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => {
      b.classList.remove("active");
      b.setAttribute("aria-selected", "false");
    });
    btn.classList.add("active");
    btn.setAttribute("aria-selected", "true");
    activeTab = btn.getAttribute("data-tab");
    render();
  });
});

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initializePage);
} else {
  initializePage();
}
  </script>
</body>
</html>
