<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reminder Logs</title>

<link rel="stylesheet" href="sidebar.css" />
<link rel="stylesheet" href="toast.css" />

<style>
  body {
    display: flex;
    background: #f1f5f9;
    font-family: "Segoe UI", sans-serif;
    margin: 0;
  }

  .main {
    flex: 1;
    padding: 40px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 18px;
  }

  .header h1 {
    font-size: 24px;
    color: #1e293b;
    margin: 0;
  }

  .header p {
    font-size: 14px;
    color: #64748b;
    margin: 6px 0 0;
  }

  .card {
    background: white;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
    overflow: hidden;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-bottom: 1px solid #e2e8f0;
  }

  .search {
    flex: 1;
    max-width: 340px;
  }

  .search input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
    font-size: 13px;
    outline: none;
    background: #f8fafc;
  }

  .filter-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid #e2e8f0;
    background: #ffffff;
    padding: 9px 12px;
    border-radius: 10px;
    cursor: pointer;
    color: #334155;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }

  .filter-btn svg {
    width: 16px;
    height: 16px;
  }

  .filter-btn.has-filter {
    border-color: #1d4ed8;
    color: #1d4ed8;
    background: #eff6ff;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    background: #f8fafc;
    padding: 12px 18px;
    text-align: left;
    color: #64748b;
    font-weight: 600;
  }

  td {
    padding: 14px 18px;
    border-top: 1px solid #e2e8f0;
    color: #334155;
  }

  .child {
    font-weight: 600;
    color: #0f172a;
  }

  .pill {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 12px;
    line-height: 1.2;
  }

  .pill.email {
    background: #dbeafe;
    color: #1d4ed8;
  }

  .pill.sms {
    background: #f3e8ff;
    color: #7e22ce;
  }

  .pill.sent {
    background: #dcfce7;
    color: #15803d;
  }

  .pill.failed {
    background: #fee2e2;
    color: #b91c1c;
  }

  .pill.pending {
    background: #e2e8f0;
    color: #475569;
  }

  .actions {
    display: flex;
    justify-content: flex-end;
  }

  .icon-btn {
    border: none;
    background: transparent;
    cursor: pointer;
    color: #64748b;
    padding: 4px;
    border-radius: 8px;
  }

  .icon-btn:hover {
    background: #f1f5f9;
    color: #0f172a;
  }

  .icon-btn svg {
    width: 18px;
    height: 18px;
  }
  /* ── Detail modal ── */
  .detail-overlay {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(10, 25, 50, 0.55); backdrop-filter: blur(4px);
    justify-content: center; align-items: center;
  }
  .detail-overlay.active { display: flex; }
  .detail-modal {
    background: #fff; border-radius: 18px; width: 480px;
    max-width: 95vw; max-height: 85vh; display: flex;
    flex-direction: column; box-shadow: 0 24px 64px rgba(0,0,0,0.22);
    overflow: hidden; animation: detailPop 0.3s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes detailPop {
    from { opacity: 0; transform: scale(0.94) translateY(14px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .detail-head {
    padding: 22px 24px 18px; border-bottom: 1px solid #e2e8f0;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .detail-head h2 { font-size: 17px; font-weight: 700; color: #0f172a; margin: 0; }
  .detail-head p  { font-size: 13px; color: #64748b; margin: 4px 0 0; }
  .detail-close {
    border: none; background: #f1f5f9; border-radius: 8px;
    padding: 6px 10px; cursor: pointer; color: #64748b;
    font-size: 18px; line-height: 1; flex-shrink: 0;
  }
  .detail-close:hover { background: #e2e8f0; color: #0f172a; }
  .detail-body { padding: 20px 24px; overflow-y: auto; }
  .detail-row {
    display: flex; justify-content: space-between; padding: 10px 0;
    border-bottom: 1px solid #f1f5f9; font-size: 13px;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: #64748b; font-weight: 600; }
  .detail-value { color: #0f172a; text-align: right; max-width: 60%; }
  @media (max-width: 720px) {
    body {
      flex-direction: column;
    }

    .sidebar {
      width: auto;
      height: auto;
    }

    .main {
      padding: 18px;
    }

    .toolbar {
      flex-direction: column;
      align-items: stretch;
    }

    .search {
      max-width: none;
    }
  }
</style>
</head>

<body>
  <div class="sidebar">
    <div>
      <div class="sidebar-header">
        <img src="logo.png" class="sidebar-logo" />
        <div class="sidebar-text">
          <div class="sidebar-title">VaxAlert</div>
          <div class="sidebar-sub">Reganion Children's Clinic</div>
        </div>
      </div>

      <div class="menu">
        <a href="admindb.html">Dashboard</a>
        <a href="adminreminderlogs.html" class="active">Reminder Logs</a>
        <a href="adminreports.html">Reports</a>
        <a href="adminprofile.html">Profile</a>
      </div>
    </div>

    <div class="profile">
      <div class="profile-name" id="sidebarName"></div>
      <div style="font-size: 12px; color: #64748b">admin</div>
      <div class="signout" onclick="logout()">Sign Out</div>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <div>
        <h1>Reminder Logs</h1>
        <p>Track automated SMS and Email notifications</p>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <div class="search">
          <input id="searchInput" type="text" placeholder="Search logs..." />
        </div>
        <button class="filter-btn" type="button" id="filterBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 3H2l8 9v7l4 2v-9l8-9z"></path>
          </svg>
          Filter Status
        </button>
      </div>

      <div style="overflow-x: auto">
        <table>
          <thead>
            <tr>
              <th>Date/Time</th>
              <th>Child</th>
              <th>Contact</th>
              <th>Channel</th>
              <th>Status</th>
              <th style="text-align: right">Actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-modal" role="dialog" aria-modal="true">
      <div class="detail-head">
        <div>
          <h2 id="detailTitle">Reminder Details</h2>
          <p id="detailSub"></p>
        </div>
        <button class="detail-close" id="detailClose" aria-label="Close">&times;</button>
      </div>
      <div class="detail-body" id="detailBody"></div>
    </div>
  </div>

  <script src="toast.js"></script>
  <script>
const API_BASE_URL = "http://localhost:5502";
let allLogs = [];
let filteredLogs = [];
let activeStatus = "all";

function getAuthToken() { return localStorage.getItem("idToken"); }

async function apiCall(endpoint, options = {}) {
  const token = getAuthToken();
  if (!token) { window.location.href = "login.html"; return null; }
  const headers = { "Content-Type": "application/json", "Authorization": `Bearer ${token}`, ...options.headers };
  try {
    const response = await fetch(`${API_BASE_URL}${endpoint}`, { ...options, headers });
    if (response.status === 401 || response.status === 403) { localStorage.clear(); window.location.href = "login.html"; return null; }
    if (!response.ok) return null;
    return await response.json();
  } catch (error) { console.error("API call failed:", error); return null; }
}

async function verifyAdminAccess() {
  const profile = await apiCall("/api/admin/profile");
  if (!profile) {
    localStorage.clear();
    window.location.href = "login.html";
    return false;
  }
  return true;
}

function formatDate(timestamp) {
  if (!timestamp) return "N/A";
  const date = new Date(typeof timestamp === "number" ? timestamp : timestamp.seconds * 1000);
  return date.toLocaleString("en-US", { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

async function loadAdminProfile() {
  const profile = await apiCall("/api/admin/profile");
  if (profile) {
    document.getElementById("sidebarName").textContent = `${profile.firstName} ${profile.lastName}`;
    localStorage.setItem("adminName", `${profile.firstName} ${profile.lastName}`);
  }
}

async function loadReminderLogs() {
  const logs = await apiCall("/api/admin/reminder-logs");
  if (!logs) {
    allLogs = [];
    render();
    return;
  }
  allLogs = logs;
  render();
}

function channelPill(ch) {
  return ch === "sms" ? '<span class="pill sms">SMS</span>' : '<span class="pill email">Email</span>';
}

function statusPill(st) {
  if (st === "sent") return '<span class="pill sent">Sent</span>';
  if (st === "failed") return '<span class="pill failed">Failed</span>';
  return '<span class="pill pending">Pending</span>';
}

function render() {
  const q = (document.getElementById("searchInput").value || "").toLowerCase();
  filteredLogs = allLogs.filter(r => {
    const matchesText = (r.sentAt + " " + r.childName + " " + r.method + " " + r.status).toLowerCase().includes(q);
    const matchesStatus = activeStatus === "all" ? true : r.status === activeStatus;
    return matchesText && matchesStatus;
  });

  document.getElementById("rows").innerHTML = filteredLogs.map((r, i) => `
    <tr>
      <td>${formatDate(r.sentAt)}</td>
      <td class="child">${r.childName}</td>
      <td>Vaccination reminder</td>
      <td>${channelPill(r.method)}</td>
      <td>${statusPill(r.status)}</td>
      <td style="text-align:right;">
        <div class="actions">
          <button class="icon-btn" type="button" title="View" onclick="openDetail(${i})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </td>
    </tr>
  `).join("");
}

// ── Detail modal ──
const detailOverlay = document.getElementById("detailOverlay");
document.getElementById("detailClose").addEventListener("click", () => detailOverlay.classList.remove("active"));
detailOverlay.addEventListener("click", e => { if (e.target === detailOverlay) detailOverlay.classList.remove("active"); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && detailOverlay.classList.contains("active")) detailOverlay.classList.remove("active"); });

function formatDateShort(ts) {
  if (!ts) return "N/A";
  const d = new Date(typeof ts === "number" ? ts : ts.seconds * 1000);
  return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
}

function openDetail(idx) {
  const r = filteredLogs[idx];
  if (!r) return;

  document.getElementById("detailTitle").textContent = r.childName || "Reminder Details";
  document.getElementById("detailSub").textContent = "Reminder Log Entry";

  let html = "";
  const row = (label, value) => `<div class="detail-row"><span class="detail-label">${label}</span><span class="detail-value">${value || "\u2014"}</span></div>`;

  html += row("Child", r.childName);
  html += row("Vaccine", r.vaccineName ? `${r.vaccineName} (${r.dose || ""})` : "Vaccination reminder");
  html += row("Due Date", formatDateShort(r.dueDate));
  html += row("Channel", r.method === "sms" ? "SMS" : r.method === "email" ? "Email" : r.method || "\u2014");
  html += row("Status", `<span class="pill ${r.status}">${r.status === "sent" ? "Sent" : r.status === "failed" ? "Failed" : "Pending"}</span>`);
  html += row("Sent At", formatDate(r.sentAt));
  html += row("Type", r.type === "test" ? "Test" : "Automated");
  if (r.reason) html += row("Reason", r.reason);

  document.getElementById("detailBody").innerHTML = html;
  detailOverlay.classList.add("active");
}

async function initializePage() {
  if (!await verifyAdminAccess()) return;
  await loadAdminProfile();
  await loadReminderLogs();
}

function logout() { localStorage.clear(); window.location.href = "login.html"; }

document.getElementById("searchInput").addEventListener("input", render);

document.getElementById("filterBtn").addEventListener("click", () => {
  const next = activeStatus === "all" ? "sent" : activeStatus === "sent" ? "failed" : activeStatus === "failed" ? "pending" : "all";
  activeStatus = next;
  const btn = document.getElementById("filterBtn");
  const isFiltered = activeStatus !== "all";
  const label = isFiltered ? activeStatus.charAt(0).toUpperCase() + activeStatus.slice(1) : "Filter Status";
  btn.classList.toggle("has-filter", isFiltered);
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9v7l4 2v-9l8-9z"></path></svg> ${label}`;
  render();
});

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initializePage);
} else {
  initializePage();
}
  </script>
</body>
</html>
